{% extends 'base.html' %}{% block content %}<section class="container sec"><h1 class="sec-t">Departments</h1><div class="row g-3">{% for d in departments %}<div class="col-md-6 col-lg-3 reveal"><div class="card-x h-100"><i class="bi {{ d.icon }} ico"></i><h5>{{ d.name }}</h5><p>{{ d.description }}</p><a href="{% url 'doctors' %}?dept={{ d.id }}">{{ d.n }} <span>doctor{{ d.n|pluralize }}</span> &rarr;</a></div></div>{% endfor %}</div></section>{% endblock %}
