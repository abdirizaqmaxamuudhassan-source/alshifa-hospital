<div class="col-sm-6 col-lg-3 reveal"><div class="card-x text-center h-100">{% if d.photo %}<img class="avatar" src="{{ d.photo.url }}" alt="">{% else %}<div class="avatar">{{ d.user.first_name|slice:":1" }}{{ d.user.last_name|slice:":1" }}</div>{% endif %}
<h5>{{ d }}</h5><div class="text-primary">{{ d.specialization }}</div><small class="text-muted d-block"><span>{{ d.department }}</span> &middot; {{ d.experience }} <span>yrs</span></small>
<small class="d-block my-2"><i class="bi bi-calendar3"></i> {{ d.availability }}</small><a class="btn btn-sm btn-primary" href="{% url 'book' %}?doctor={{ d.id }}">Book</a></div></div>
